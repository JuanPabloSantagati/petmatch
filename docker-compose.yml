services:
  db:
    image: postgres:16-alpine
    container_name: petmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petmatch
      POSTGRES_PASSWORD: petmatch
      POSTGRES_DB: petmatch
    ports:
      - "5432:5432"
    volumes:
      - petmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  petmatch_pgdata:
